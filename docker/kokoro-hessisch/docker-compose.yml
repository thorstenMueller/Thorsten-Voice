services:
  thorsten-kokoro-hessisch-tts:
    image: thorstenvoice/kokoro-tts-hessisch:latest
    container_name: thorsten-kokoro-hessisch-tts
    ports:
      - "8000:8000"
    environment:
      # Checkpoint: "7" (Default/empfohlen) oder 1-6/8-10
      - KOKORO_EPOCH=7
      # "cpu" (funktioniert überall) oder "cuda" (nur mit NVIDIA-GPU + passendem Torch-Build)
      - KOKORO_DEVICE=cpu
    volumes:
      # Damit das Modell nicht bei jedem Neustart erneut von Hugging Face
      # heruntergeladen werden muss.
      - hf-cache:/data/hf-cache
    restart: unless-stopped

volumes:
  hf-cache:
